<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>メダルバンク</title>
  <meta name="description" content="スロットの貯メダルを、自分の資産として管理するアプリ">
  <meta name="theme-color" content="#f3f4f8">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="メダルバンク">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/icon-192.png" alt="" width="96" height="96">
    <div>メダルバンク</div>
  </div>

  <main id="main"></main>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-msg"></span>
    <button type="button" class="toast-action" hidden></button>
  </div>

  <nav class="nav" aria-label="メインメニュー">
    <a href="#/home" data-tab="home"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>ホーム</span></a>
    <a href="#/record" data-tab="record"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg><span>記録</span></a>
    <a href="#/history" data-tab="history"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>履歴</span></a>
    <a href="#/stores" data-tab="stores"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5 5.5 5h13L20 9.5"/><path d="M4 9.5h16v1a3 3 0 0 1-5.33 1.9A3 3 0 0 1 12 13.5a3 3 0 0 1-2.67-1.1A3 3 0 0 1 4 10.5z"/><path d="M5.5 13v6.5h13V13"/></svg><span>店舗</span></a>
    <a href="#/settings" data-tab="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span>設定</span></a>
  </nav>

  <noscript><p style="padding:16px">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
